<!-- Pagination component -->
<div class="flex items-center justify-between mt-4 px-4 py-3 bg-white border border-gray-200 rounded-lg shadow-sm">
  <!-- Mobile pagination controls -->
  <div class="flex-1 flex justify-between sm:hidden">
    <button 
      [disabled]="currentPage === 1"
      [ngClass]="{'opacity-50 cursor-not-allowed': currentPage === 1}"
      class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"
      (click)="onPageChange(currentPage - 1)">
      Anterior
    </button>
    <button 
      [disabled]="currentPage === totalPages"
      [ngClass]="{'opacity-50 cursor-not-allowed': currentPage === totalPages}"
      class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"
      (click)="onPageChange(currentPage + 1)">
      Siguiente
    </button>
  </div>
  
  <!-- Desktop pagination controls -->
  <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
    <!-- Results count -->
    <div>
      <p class="text-sm text-gray-700">
        Mostrando <span class="font-medium">{{ startItem }}</span> a <span class="font-medium">{{ endItem }}</span> de <span class="font-medium">{{ totalItems }}</span> resultados
      </p>
    </div>
    
    <!-- Page navigation -->
    <div>
      <nav class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px" aria-label="Pagination">
        <!-- Previous page button -->
        <button 
          [disabled]="currentPage === 1"
          [ngClass]="{'opacity-50 cursor-not-allowed': currentPage === 1}"
          class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
          (click)="onPageChange(currentPage - 1)">
          <span class="sr-only">Anterior</span>
          <mat-icon fontIcon="chevron_left"></mat-icon>
        </button>
        
        <!-- Page numbers -->
        <ng-container *ngFor="let page of getPageNumbers()">
          <button 
            *ngIf="page !== '...'"
            [ngClass]="{'bg-blue-50 border-blue-500 text-blue-600': page === currentPage, 'bg-white text-gray-700': page !== currentPage}"
            class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium hover:bg-gray-50"
            (click)="onPageChange(+page)">
            {{ page }}
          </button>
          <span *ngIf="page === '...'" class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700">
            ...
          </span>
        </ng-container>
        
        <!-- Next page button -->
        <button 
          [disabled]="currentPage === totalPages"
          [ngClass]="{'opacity-50 cursor-not-allowed': currentPage === totalPages}"
          class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
          (click)="onPageChange(currentPage + 1)">
          <span class="sr-only">Siguiente</span>
          <mat-icon fontIcon="chevron_right"></mat-icon>
        </button>
      </nav>
    </div>
  </div>
</div>
