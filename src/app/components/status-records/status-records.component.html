<!-- Main container with responsive padding -->
<div class="w-full overflow-hidden">
  <!-- Search and filter section -->
  <div class="mb-4 flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="relative w-full md:w-64">
      <input 
        type="text" 
        placeholder="Buscar registros..." 
        class="w-full pl-10 pr-4 py-2 rounded-lg border focus:outline-none focus:ring-3 focus:ring-blue-200 focus:border-blue-500"
        (input)="searchRecords($event)"
      >
      <div class="absolute left-3 top-2.5 text-gray-400">
        <mat-icon fontIcon="search"></mat-icon>
      </div>
    </div>
    
    <div class="flex gap-2">
      <!-- <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-1">
        <mat-icon fontIcon="filter_list"></mat-icon>
        <span>Filtrar</span>
      </button> -->
      <button class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors flex items-center gap-1">
        <mat-icon fontIcon="file_download"></mat-icon>
        <span>Exportar</span>
      </button>
    </div>
  </div>

  <!-- Table container with shadow and rounded corners -->
  <div class="overflow-x-auto rounded-lg shadow-md">
    <table class="min-w-full divide-y divide-gray-200">
      <!-- Table Header -->
      <thead class="bg-gray-50">
        <tr>
          <th scope="col" 
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
              (click)="sortRecords('folio')">
            Folio
            <span class="inline-block ml-1">
              <mat-icon *ngIf="sortColumn === 'folio' && sortDirection === 'asc'" fontIcon="arrow_upward" class="text-xs"></mat-icon>
              <mat-icon *ngIf="sortColumn === 'folio' && sortDirection === 'desc'" fontIcon="arrow_downward" class="text-xs"></mat-icon>
            </span>
          </th>
          <th scope="col" 
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
              (click)="sortRecords('claveSucursal')">
            Clave Sucursal
            <span class="inline-block ml-1">
              <mat-icon *ngIf="sortColumn === 'claveSucursal' && sortDirection === 'asc'" fontIcon="arrow_upward" class="text-xs"></mat-icon>
              <mat-icon *ngIf="sortColumn === 'claveSucursal' && sortDirection === 'desc'" fontIcon="arrow_downward" class="text-xs"></mat-icon>
            </span>
          </th>
          <th scope="col" 
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
              (click)="sortRecords('status')">
            Estatus
            <span class="inline-block ml-1">
              <mat-icon *ngIf="sortColumn === 'status' && sortDirection === 'asc'" fontIcon="arrow_upward" class="text-xs"></mat-icon>
              <mat-icon *ngIf="sortColumn === 'status' && sortDirection === 'desc'" fontIcon="arrow_downward" class="text-xs"></mat-icon>
            </span>
          </th>
          <th scope="col" 
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
              (click)="sortRecords('detalle')">
            Detalle
            <span class="inline-block ml-1">
              <mat-icon *ngIf="sortColumn === 'detalle' && sortDirection === 'asc'" fontIcon="arrow_upward" class="text-xs"></mat-icon>
              <mat-icon *ngIf="sortColumn === 'detalle' && sortDirection === 'desc'" fontIcon="arrow_downward" class="text-xs"></mat-icon>
            </span>
          </th>
          <th scope="col" 
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100"
              (click)="sortRecords('fecha')">
            Fecha
            <span class="inline-block ml-1">
              <mat-icon *ngIf="sortColumn === 'fecha' && sortDirection === 'asc'" fontIcon="arrow_upward" class="text-xs"></mat-icon>
              <mat-icon *ngIf="sortColumn === 'fecha' && sortDirection === 'desc'" fontIcon="arrow_downward" class="text-xs"></mat-icon>
            </span>
          </th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Ver
          </th>
        </tr>
      </thead>
      
      <!-- Table Body -->
      <tbody class="bg-white divide-y divide-gray-200">
        <!-- Dynamic rows using *ngFor -->
        <tr *ngFor="let record of paginatedRecords" class="hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
            {{ record.folio }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ record.claveSucursal }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <!-- Dynamic status badge with conditional styling -->
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full"
                  [ngClass]="{
                    'bg-yellow-100 text-yellow-800': record.status === 'Pendiente',
                    'bg-blue-100 text-blue-800': record.status === 'En proceso',
                    'bg-green-100 text-green-800': record.status === 'Finalizado'
                  }">
              {{ record.status }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ record.detalle }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ record.fecha }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <button class="text-indigo-600 hover:text-indigo-900 mr-3" (click)="viewRecord(record)">
              <mat-icon fontIcon="visibility"></mat-icon>
            </button>
            
          </td>
        </tr>

        <!-- Empty state when no records -->
        <tr *ngIf="filteredRecords.length === 0">
          <td colspan="6" class="px-6 py-10 text-center text-gray-500">
            No se encontraron registros
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Use the pagination component -->
  <app-pagination
    [totalItems]="filteredRecords.length"
    [itemsPerPage]="itemsPerPage"
    [currentPage]="currentPage"
    (pageChange)="onPageChange($event)">
  </app-pagination>

  <app-status-detail 
    *ngIf="showDetailsWindow"
    [selectedRecord]="selectedRecord"
    (close)="closeDetailsWindow()"
   >
  </app-status-detail>



</div>
