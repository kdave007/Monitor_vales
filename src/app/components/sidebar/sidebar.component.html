<div class="">
    <aside [ngClass]="{'w-64': !isCollapsed, 'w-16': isCollapsed}" 
           class="fixed right-0 top-0 h-screen overflow-hidden bg-gray-900 text-white transition-all duration-300 ease-in-out">
        <div class="h-full flex flex-col">
            <!-- Toggle Button -->
        
            <button (click)="onToggle()" 
            class="w-full p-3 flex justify-center hover:bg-gray-800 transition-colors duration-200">
                <div class="flex flex-col space-y-1.5 w-6">
                    <div class="h-0.5 bg-gray-300 rounded-full transition-all duration-300 ease-in-out"
                        [ngClass]="{'w-6': !isCollapsed, 'w-4': isCollapsed}"></div>
                    <div class="h-0.5 bg-gray-300 rounded-full w-6 transition-all duration-300"></div>
                    <div class="h-0.5 bg-gray-300 rounded-full transition-all duration-300 ease-in-out"
                        [ngClass]="{'w-6': !isCollapsed, 'w-4': isCollapsed}"></div>
                </div>
            </button>
          
            <div class="p-4 border-b border-gray-700">
                <!-- Add profile content here -->
            </div>
            <nav class="flex-1 overflow-hidden">
                <ul class="p-2 space-y-1">
                    <!-- Dashboard -->
                    <li>
                        <a routerLink="/main" routerLinkActive="bg-gray-800 text-white" class="flex items-center py-2 pr-4 pl-[0.75rem] text-gray-200 hover:bg-gray-800 rounded-lg">
                            
                            <div class="flex items-center justify-center w-10 h-6 mr-3 ">
                                <!-- Document icon -->
                                <mat-icon fontIcon="home" ></mat-icon>
                            </div>
                            <span [ngClass]="{'opacity-0 w-0': isCollapsed}" 
                            class="ml-3 transition-all duration-300 ease-in-out">Principal</span>
                        </a>
                    </li>

                    <!-- Reports -->
                    <li>
                        <a routerLink="/review" routerLinkActive="bg-gray-800 text-white" class="flex items-center py-2 pr-4 pl-[0.75rem] text-gray-200 hover:bg-gray-800 rounded-lg">
                            <div class="flex items-center justify-center w-10 h-6 mr-3">
                                <!-- Document icon -->
                                <mat-icon fontIcon="insert_chart_outlined" ></mat-icon>
                            </div>
                            <span [ngClass]="{'opacity-0 w-0': isCollapsed}" 
                                class="ml-3 transition-all duration-300 ease-in-out">Reportes</span>
                        </a>
                    </li>

                    <!-- Settings -->
                    <li>
                        <a routerLink="#" routerLinkActive="bg-gray-800 text-white" class="flex items-center py-2 pr-4 pl-[0.75rem] text-gray-200 hover:bg-gray-800 rounded-lg">
                            <div class="flex items-center justify-center w-10 h-6 mr-3">
                                <!-- Gear icon -->
                                <mat-icon fontIcon="dvr" ></mat-icon>
                            </div>
                            <span [ngClass]="{'opacity-0 w-0': isCollapsed}" 
                                class="ml-3 transition-all duration-300 ease-in-out">Configuración</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <!-- Add footer content here -->
            </div>
        </div>
    </aside>
</div>
