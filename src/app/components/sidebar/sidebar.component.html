<div class="">
    <aside [ngClass]="{'w-64': !isCollapsed, 'w-16': isCollapsed}" 
           class="fixed left-0 top-0 h-screen overflow-hidden bg-gray-900 dark:bg-gray-900 transition-all duration-300 ease-in-out">
        <div class="h-full flex flex-col">
            <!-- Toggle Button -->
        
            <button (click)="onToggle()" 
            class="w-full p-3 flex justify-center hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">
                <div class="flex flex-col space-y-1.5 w-6">
                    <div class="h-0.5 bg-gray-600 dark:bg-gray-300 rounded-full transition-all duration-300 ease-in-out"
                        [ngClass]="{'w-6': !isCollapsed, 'w-4': isCollapsed}"></div>
                    <div class="h-0.5 bg-gray-600 dark:bg-gray-300 rounded-full w-6 transition-all duration-300"></div>
                    <div class="h-0.5 bg-gray-600 dark:bg-gray-300 rounded-full transition-all duration-300 ease-in-out"
                        [ngClass]="{'w-6': !isCollapsed, 'w-4': isCollapsed}"></div>
                </div>
            </button>
          
            

            <div class="p-4 border-b dark:border-gray-700">
                <!-- Add profile content here -->
            </div>
            <nav class="flex-1 overflow-hidden">
                <ul class="p-2 space-y-1">
                    <!-- Dashboard -->
                    <li>
                        <a href="#" class="flex items-center px-4 py-2 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                            <div class="h-5 w-5 mr-3 flex items-center justify-center">
                                <!-- Home icon using squares -->
                                <div class="w-3 h-3 border-2 border-current rotate-45"></div>
                            </div>
                            <span [ngClass]="{'opacity-0 w-0': isCollapsed}" 
                            class="ml-3 transition-all duration-300 ease-in-out">Dashboard</span>
                        </a>
                    </li>

                    <!-- Reports -->
                    <li>
                        <a href="#" class="flex items-center px-4 py-2 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                            <div class="h-5 w-5 mr-3 flex items-center justify-center">
                                <!-- Document icon -->
                                <div class="w-3 h-4 border-2 border-current rounded-sm"></div>
                            </div>
                            <span [ngClass]="{'opacity-0 w-0': isCollapsed}" 
                                class="ml-3 transition-all duration-300 ease-in-out">Reportes</span>
                        </a>
                    </li>

                    <!-- Settings -->
                    <li>
                        <a href="#" class="flex items-center px-4 py-2 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
                            <div class="h-5 w-5 mr-3 flex items-center justify-center">
                                <!-- Gear icon -->
                                <div class="w-4 h-4 border-2 border-current rounded-full"></div>
                            </div>
                            <span [ngClass]="{'opacity-0 w-0': isCollapsed}" 
                                class="ml-3 transition-all duration-300 ease-in-out">Configuración</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="p-4 border-t dark:border-gray-700">
                <!-- Add footer content here -->
            </div>
        </div>
    </aside>
</div>
