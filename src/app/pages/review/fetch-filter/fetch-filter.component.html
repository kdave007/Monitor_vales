<div class="relative space-y-4 p-4">

    <div class="flex justify-start mb-8">
        <div class="relative inline-block w-64">
          <select 
            [(ngModel)]="selectedStateId"
            (change)="onStateChange($event)"
            class="block appearance-none w-full bg-white border border-gray-300 hover:border-gray-400 px-4 py-2 pr-8 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700">
            <option *ngFor="let state of states" [value]="state.id">{{state.name}}</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
              <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
            </svg>
          </div>
        </div>
      </div>

  <div class="flex gap-10">
    <div class="inline-flex items-center">
      <label class="relative flex items-center cursor-pointer" for="month">
        <input name="dateView" type="radio" [(ngModel)]="selectedView" [value]="'month'" 
          class="peer h-5 w-5 cursor-pointer appearance-none rounded-full border border-slate-300 checked:border-slate-400 transition-all" 
          id="month">
        <span class="absolute bg-blue-600 w-3 h-3 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity duration-200 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
        </span>
      </label>
      <label class="ml-2 text-slate-600 cursor-pointer text-sm" for="month">Mes</label>
    </div>
   
    <div class="inline-flex items-center">
      <label class="relative flex items-center cursor-pointer" for="day">
        <input name="dateView" type="radio" [(ngModel)]="selectedView" [value]="'day'"
          class="peer h-5 w-5 cursor-pointer appearance-none rounded-full border border-slate-300 checked:border-slate-400 transition-all" 
          id="day">
        <span class="absolute bg-green-600 w-3 h-3 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity duration-200 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
        </span>
      </label>
      <label class="ml-2 text-slate-600 cursor-pointer text-sm" for="day">Día</label>
    </div>
  </div>

  <div class="w-full max-w-xs">
    <div class="relative">
      <input type="text" 
             [value]="selectedDate | date: selectedView === 'month' ? 'MMMM yyyy' : 'dd/MM/yyyy':'es'"
             readonly
             (click)="togglePicker()"
             class="w-full px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-md cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      <button class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700"
              (click)="togglePicker()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      </button>

      <!-- Month Picker -->
      <div *ngIf="showPicker && selectedView === 'month'" 
           class="absolute left-0 mt-1 w-96 bg-white rounded-lg shadow-lg border border-gray-200 z-50">
        <div class="p-4">
          <div class="flex justify-between items-center mb-4">
            <button class="p-1 hover:bg-gray-100 rounded" (click)="changeYear(-1)">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <span class="text-lg font-semibold">{{ selectedYear }}</span>
            <button class="p-1 hover:bg-gray-100 rounded" (click)="changeYear(1)">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
          <div class="grid grid-cols-3 gap-4">
            <button *ngFor="let month of months; let i = index"
                    (click)="selectMonth(i)"
                    class="w-full min-h-[2.5rem] px-3 py-1.5 text-sm rounded hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 text-center whitespace-nowrap overflow-hidden"
                    [class.bg-blue-100]="i === selectedMonth && selectedYear === currentYear">
              {{ month }}
            </button>
          </div>
        </div>
      </div>

      <!-- Day Picker -->
      <div *ngIf="showPicker && selectedView === 'day'"
           class="absolute left-0 mt-1 w-64 bg-white rounded-lg shadow-lg border border-gray-200 z-50">
        <div class="p-2">
          <div class="flex justify-between items-center mb-4">
            <button class="p-1 hover:bg-gray-100 rounded" (click)="selectedMonth = selectedMonth - 1">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <span class="text-lg font-semibold">{{ months[selectedMonth] }} {{ selectedYear }}</span>
            <button class="p-1 hover:bg-gray-100 rounded" (click)="selectedMonth = selectedMonth + 1">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
          <div class="grid grid-cols-7 gap-1 text-center mb-2">
            <div *ngFor="let day of ['D', 'L', 'M', 'M', 'J', 'V', 'S']" class="text-xs font-semibold text-gray-500">
              {{ day }}
            </div>
          </div>
          <div class="grid grid-cols-7 gap-1">
            <div *ngFor="let day of getDaysInMonth(selectedYear, selectedMonth)"
                 class="text-center">
              <button (click)="selectDay(day)"
                      class="w-8 h-8 rounded-full text-sm hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      [class.bg-blue-100]="isToday(day)"
                      [class.font-semibold]="selectedDate.getDate() === day">
                {{ day }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div>
    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" (click)="update()">
      Actualizar
    </button>
  </div>
</div>
